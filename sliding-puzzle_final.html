<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑塊拼圖 · 九宮格</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@500;700&family=Space+Mono:wght@700&display=swap');

  :root{
    --bg-1:#0f2622;
    --bg-2:#173a33;
    --tile-face:#f3e7c9;
    --tile-face-shadow:#d9c89f;
    --tray:#12312b;
    --tray-edge:#0a1f1b;
    --gold:#c9a227;
    --rust:#c1502e;
    --ink:#12271f;
    --paper:#f3e7c9;
    --muted:#9fbfb2;
    --board-size:min(88vw, 55dvh, 560px);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 85% 85%, #1d453d, transparent 50%),
      var(--bg-1);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--paper);
    padding:calc(clamp(14px, 3dvh, 32px) + env(safe-area-inset-top, 0px)) clamp(10px, 4vw, 16px) clamp(14px, 3dvh, 32px);
  }

  .stage{
    width:100%;
    max-width:680px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px, 2dvh, 18px);
  }

  header{ text-align:center; }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(28px, 6vw, 40px);
    margin:0 0 6px;
    letter-spacing:.06em;
    color:var(--paper);
    text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .sub{
    margin:0;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.08em;
  }

  .tray{
    position:relative;
    padding:clamp(14px, 3vw, 22px);
    border-radius:18px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 10px),
      linear-gradient(160deg, var(--tray), var(--tray-edge));
    box-shadow:
      0 18px 40px rgba(0,0,0,.45),
      inset 0 0 0 1px rgba(255,255,255,.06),
      inset 0 2px 6px rgba(0,0,0,.4);
    width:100%;
    max-width:var(--board-size);
  }
  .tray::before, .tray::after,
  .tray .corner-l, .tray .corner-r{
    content:"";
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #e8d49a, var(--gold) 70%);
    box-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .tray::before{ top:10px; left:10px; }
  .tray::after{ top:10px; right:10px; }
  .tray .corner-l{ bottom:10px; left:10px; }
  .tray .corner-r{ bottom:10px; right:10px; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    padding:9px 14px;
    border-radius:9px;
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 3px 0 var(--tile-face-shadow), 0 6px 12px rgba(0,0,0,.3);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--tile-face-shadow); }
  .btn.rust{ background:var(--rust); color:#fff2e8; box-shadow:0 3px 0 #8a3a1f, 0 6px 12px rgba(0,0,0,.3); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; transform:none; }
  input[type=file]{ display:none; }

  .counter{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .counter b{ color:var(--gold); font-size:14px; }

  .board-wrap{ position:relative; }
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    width:100%;
    aspect-ratio:1/1;
    outline:none;
    border-radius:8px;
  }
  .board:focus-visible{ box-shadow:0 0 0 3px var(--gold); }

  .tile{
    position:relative;
    border-radius:6px;
    background-color:var(--tile-face);
    background-size:cover;
    background-position:center;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.25),
      0 3px 6px rgba(0,0,0,.35);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .tile.movable{ cursor:pointer; }
  .tile.movable:hover{ transform:scale(.97); }
  .tile-number{
    position:absolute;
    top:6px; left:6px;
    min-width:24px;
    height:24px;
    padding:0 6px;
    border-radius:50%;
    background:rgba(18,39,31,.85);
    border:2px solid var(--gold);
    color:var(--paper);
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .tile.empty{
    background-image:none !important;
    background:
      repeating-radial-gradient(circle at center, rgba(255,255,255,.05) 0 2px, transparent 2px 14px),
      rgba(0,0,0,.28);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .tile.reveal{
    animation:flipin .6s ease;
  }
  @keyframes flipin{
    0%{ transform:rotateY(90deg) scale(.9); opacity:0; }
    100%{ transform:rotateY(0) scale(1); opacity:1; }
  }
  .board.solved{
    animation:glow 1.4s ease-in-out 1;
  }
  @keyframes glow{
    0%,100%{ box-shadow:none; }
    40%{ box-shadow:0 0 0 6px rgba(201,162,39,.55); }
  }
  @media (prefers-reduced-motion: reduce){
    .tile.reveal, .board.solved{ animation:none !important; }
  }

  .win-banner{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:rgba(18,39,31,.92);
    border:1px solid var(--gold);
    color:var(--paper);
    padding:10px 18px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    letter-spacing:.05em;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .win-banner.hidden{ opacity:0; }

  .hint{
    margin-top:clamp(8px, 2dvh, 16px);
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.03em;
    line-height:1.6;
  }
  .hint kbd{
    display:inline-block;
    font-family:'Space Mono', monospace;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:4px;
    padding:1px 6px;
    margin:0 1px;
    font-size:11px;
    color:var(--paper);
  }

  .picker{
    width:100%;
    max-width:var(--board-size);
    margin-top:2px;
  }
  .picker-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.05em;
    margin:0 0 8px;
    text-align:center;
  }
  .picker-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));
    gap:8px;
  }
  .picker-item{
    appearance:none;
    border:none;
    padding:0;
    cursor:pointer;
    border-radius:10px;
    aspect-ratio:1/1;
    background-size:cover;
    background-position:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.12), 0 3px 6px rgba(0,0,0,.35);
    transition:transform .08s ease, box-shadow .12s ease;
  }
  .picker-item:hover{ transform:scale(1.05); }
  .picker-item.active{
    box-shadow:inset 0 0 0 3px var(--gold), 0 3px 6px rgba(0,0,0,.35);
  }

  .dpad{
    margin-top:clamp(8px, 2dvh, 14px);
    display:grid;
    grid-template-columns:repeat(3, clamp(28px, 8dvh, 36px));
    grid-template-rows:repeat(3, clamp(28px, 8dvh, 36px));
    gap:4px;
    justify-content:center;
  }
  .dpad button{
    appearance:none;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.08);
    color:var(--paper);
    border-radius:8px;
    font-size:15px;
    transition:background .1s ease;
  }
  .dpad button:hover{ background:rgba(255,255,255,.18); }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:2; }
  .dpad .right{ grid-column:3; grid-row:2; }

  /* On shorter screens (phones, small/landscape windows) the header, dpad,
     picker and hint are trimmed or made scrollable so the board and controls
     always stay fully visible without needing to scroll the whole page. */
  @media (max-height:700px){
    h1{ font-size:clamp(20px, 5vw, 26px); margin-bottom:4px; }
    .sub{ font-size:11px; }
    .hint{ display:none; }
    .picker-grid{ grid-template-columns:repeat(auto-fill, minmax(52px, 1fr)); gap:6px; }
  }
  @media (max-height:520px){
    .picker{ max-height:20dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <h1>滑塊拼圖</h1>
    <p class="sub">上傳一張照片 · 切成拼圖 · 用方向鍵重新拼回原圖</p>
  </header>

  <div class="tray">
    <span class="corner-l"></span><span class="corner-r"></span>
    <div class="controls">
      <label class="btn" for="fileInput">上傳圖片</label>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn rust" id="shuffleBtn">重新洗牌</button>
      <button class="btn" id="easierBtn">減少難度</button>
      <div class="counter" id="levelLabel">難度 <b id="levelText">3×3</b></div>
      <button class="btn" id="harderBtn">增加難度</button>
      <div class="counter">移動次數 <b id="moveCount">0</b></div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" tabindex="0"></div>
      <div class="win-banner hidden" id="winBanner">🎉 完成了！最後一塊已拼上</div>
    </div>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
  </div>

  <div class="picker">
    <p class="picker-label">或直接選一隻寶可夢來拼</p>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>

  <p class="hint">
    使用方向鍵 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移動空格旁的拼圖塊，<br>
    也可以直接點擊拼圖塊，或用上方按鈕操作。<br>
    最後一塊圖片在完成前不會顯示，拼對後才會出現。
  </p>
</div>

<canvas id="workCanvas" hidden></canvas>

  function cropToSquareCanvas(img, outSize){
    const c = document.createElement('canvas');
    c.width = outSize; c.height = outSize;
    const ctx = c.getContext('2d');
    const side = Math.min(img.width, img.height);
    const sx = (img.width - side) / 2;
    const sy = (img.height - side) / 2;
    ctx.drawImage(img, sx, sy, side, side, 0, 0, outSize, outSize);
    return c;
  }

  function sliceCanvasIntoTiles(sourceCanvas){
    const tileW = SRC / COLS;
    const tileH = SRC / ROWS;
    const tiles = [];
    for(let row=0; row<ROWS; row++){
      for(let col=0; col<COLS; col++){
        const c = document.createElement('canvas');
        c.width = tileW; c.height = tileH;
        const ctx = c.getContext('2d');
        ctx.drawImage(sourceCanvas, col*tileW, row*tileH, tileW, tileH, 0, 0, tileW, tileH);
        tiles.push(c.toDataURL());
      }
    }
    return tiles;
  }

  function generatePlaceholderCanvas(){
    const c = document.createElement('canvas');
    c.width = SRC; c.height = SRC;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,SRC,SRC);
    grad.addColorStop(0, '#1d453d');
    grad.addColorStop(.5, '#173a33');
    grad.addColorStop(1, '#0f2622');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,SRC,SRC);

    const blobs = [
      [180,180,120,'rgba(201,162,39,.55)'],
      [430,260,150,'rgba(193,80,46,.45)'],
      [300,420,170,'rgba(159,191,178,.30)']
    ];
    blobs.forEach(([x,y,r,color])=>{
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,color);
      g.addColorStop(1,'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });

    ctx.font = '900 320px "Noto Serif TC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(243,231,201,.9)';
    ctx.fillText('圖', SRC/2, SRC/2 + 20);

    return c;
  }

  function generatePlaceholder(){
    currentSourceCanvas = generatePlaceholderCanvas();
    return sliceCanvasIntoTiles(currentSourceCanvas);
  }

  function loadImageFromSrc(src, onDone){
    const img = new Image();
    img.onload = () => {
      currentSourceCanvas = cropToSquareCanvas(img, SRC);
      tileImages = sliceCanvasIntoTiles(currentSourceCanvas);
      startNewGame();
      if(onDone) onDone();
    };
    img.src = src;
  }

  function loadImageFile(file){
    const reader = new FileReader();
    reader.onload = (e) => loadImageFromSrc(e.target.result);
    reader.readAsDataURL(file);
  }

  function applyBoardGridCSS(){
    boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
  }

  function setLevel(index){
    const clamped = Math.max(0, Math.min(LEVELS.length - 1, index));
    levelIndex = clamped;
    ROWS = LEVELS[levelIndex].rows;
    COLS = LEVELS[levelIndex].cols;
    TOTAL = ROWS * COLS;
    BLANK = TOTAL - 1;
    applyBoardGridCSS();
    if(levelText) levelText.textContent = `${COLS}×${ROWS}`;
    if(easierBtn) easierBtn.disabled = (levelIndex === 0);
    if(harderBtn) harderBtn.disabled = (levelIndex === LEVELS.length - 1);
    if(!currentSourceCanvas) currentSourceCanvas = generatePlaceholderCanvas();
    tileImages = sliceCanvasIntoTiles(currentSourceCanvas);
    startNewGame();
  }

  function buildPicker(){
    Object.keys(POKEMON_LIBRARY).forEach((name) => {
      const btn = document.createElement('button');
      btn.className = 'picker-item';
      btn.type = 'button';
      btn.title = name;
      btn.style.backgroundImage = `url(${POKEMON_LIBRARY[name]})`;
      btn.addEventListener('click', () => {
        pickerGrid.querySelectorAll('.picker-item').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        loadImageFromSrc(POKEMON_LIBRARY[name]);
      });
      pickerGrid.appendChild(btn);
    });
  }

  function solvedOrder(){
    return Array.from({length: TOTAL}, (_, i) => i);
  }

  function isSolved(b){
    return b.every((v,i) => v === i);
  }

  function posRC(pos){ return { r: Math.floor(pos/COLS), c: pos % COLS }; }
  function rcPos(r,c){ return r*COLS + c; }

  function neighborForDirection(dir){
    const {r,c} = posRC(blankPos);
    // Pressing a direction slides the neighboring tile in that direction into the blank.
    if(dir === 'up'    && r < ROWS-1) return rcPos(r+1, c);
    if(dir === 'down'  && r > 0)      return rcPos(r-1, c);
    if(dir === 'left'  && c < COLS-1) return rcPos(r, c+1);
    if(dir === 'right' && c > 0)      return rcPos(r, c-1);
    return -1;
  }

  function isAdjacentToBlank(pos){
    const a = posRC(pos), b = posRC(blankPos);
    return (Math.abs(a.r-b.r) + Math.abs(a.c-b.c)) === 1;
  }

  function slide(targetPos, {silent=false} = {}){
    if(targetPos < 0 || solved) return false;
    board[blankPos] = board[targetPos];
    board[targetPos] = BLANK;
    blankPos = targetPos;
    if(!silent){
      moveCount++;
      moveCountEl.textContent = moveCount;
      checkWin();
    }
    render();
    return true;
  }

  function moveDirection(dir){
    const target = neighborForDirection(dir);
    slide(target);
  }

  function shuffleBoard(){
    board = solvedOrder();
    blankPos = BLANK;
    let last = -1;
    for(let i=0; i<250; i++){
      const {r,c} = posRC(blankPos);
      const options = [];
      if(r < ROWS-1) options.push(rcPos(r+1,c));
      if(r > 0)      options.push(rcPos(r-1,c));
      if(c < COLS-1) options.push(rcPos(r,c+1));
      if(c > 0)      options.push(rcPos(r,c-1));
      const choices = options.filter(o => o !== last);
      const pick = choices[Math.floor(Math.random()*choices.length)];
      last = blankPos;
      slide(pick, {silent:true});
    }
    if(isSolved(board)){
      slide(neighborForDirection('up'), {silent:true});
    }
  }

  function checkWin(){
    if(isSolved(board)){
      solved = true;
      boardEl.classList.add('solved');
      winBanner.classList.remove('hidden');
    }
  }

  function render(){
    boardEl.innerHTML = '';
    for(let pos=0; pos<TOTAL; pos++){
      const tileId = board[pos];
      const div = document.createElement('div');
      div.className = 'tile';
      div.dataset.pos = pos;

      const isBlank = (tileId === BLANK) && !solved;
      if(isBlank){
        div.classList.add('empty');
      } else {
        div.style.backgroundImage = `url(${tileImages[tileId]})`;
        if(solved && tileId === BLANK) div.classList.add('reveal');
      }

      if(tileId !== BLANK){
        const num = document.createElement('span');
        num.className = 'tile-number';
        num.textContent = tileId + 1;
        div.appendChild(num);
      }

      if(!solved && isAdjacentToBlank(pos)){
        div.classList.add('movable');
        div.addEventListener('click', () => slide(pos));
      }
      boardEl.appendChild(div);
    }
  }

  function startNewGame(){
    moveCount = 0;
    solved = false;
    moveCountEl.textContent = 0;
    winBanner.classList.add('hidden');
    boardEl.classList.remove('solved');
    shuffleBoard();
    render();
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file){
      pickerGrid.querySelectorAll('.picker-item').forEach(el => el.classList.remove('active'));
      loadImageFile(file);
    }
  });

  shuffleBtn.addEventListener('click', () => {
    if(!currentSourceCanvas) currentSourceCanvas = generatePlaceholderCanvas();
    startNewGame();
  });

  easierBtn.addEventListener('click', () => setLevel(levelIndex - 1));
  harderBtn.addEventListener('click', () => setLevel(levelIndex + 1));

  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => moveDirection(btn.dataset.dir));
  });

  window.addEventListener('keydown', (e) => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
    if(map[e.key]){
      e.preventDefault();
      moveDirection(map[e.key]);
    }
  });

  boardEl.addEventListener('click', () => boardEl.focus());

  // Boot with a placeholder puzzle so the game is playable before any upload.
  buildPicker();
  applyBoardGridCSS();
  if(levelText) levelText.textContent = `${COLS}×${ROWS}`;
  if(easierBtn) easierBtn.disabled = (levelIndex === 0);
  if(harderBtn) harderBtn.disabled = (levelIndex === LEVELS.length - 1);
  tileImages = generatePlaceholder();
  startNewGame();
})();
</script>
</body>
</html>
